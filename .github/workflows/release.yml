name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate embedded PowerShell 5.1 scripts
        shell: powershell
        run: ./scripts/validate-powershell.ps1

      - name: Validate project invariants
        shell: pwsh
        run: ./scripts/quality-check.ps1

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/SSDSystemGuard/SSDSystemGuard.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o dist/win-x64 `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=None `
            /p:DebugSymbols=false

          Get-FileHash dist/win-x64/SSDSystemGuard.exe -Algorithm SHA256 |
            Format-List |
            Out-File dist/win-x64/SHA256.txt

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/win-x64/SSDSystemGuard.exe `
            dist/win-x64/SHA256.txt `
            UNINSTALL_SSD_SYSTEM_GUARD.bat `
            --title "SSD System Guard ${{ github.ref_name }}" `
            --generate-notes
